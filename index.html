<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lambert 93 → WGS84</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

.wrapper {
  max-width: 420px;
  margin: 60px auto;
  padding: 0 16px;
}

.card {
  background: #ffffff;
  border-radius: 12px;
  padding: 24px;
  border: 1px solid #e5e7eb;
}

h1 {
  font-size: 18px;
  margin: 0 0 20px 0;
  font-weight: 600;
}

.field {
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 13px;
  margin-bottom: 6px;
  color: #6b7280;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
  background: #fff;
}

input:focus {
  outline: none;
  border-color: #2563eb;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: #111827;
  color: white;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
}

button:hover {
  background: #1f2937;
}

.result {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid #e5e7eb;
  font-size: 14px;
}

.result strong {
  font-weight: 600;
}

.link {
  display: inline-block;
  margin-top: 10px;
  color: #2563eb;
  text-decoration: none;
}

.link:hover {
  text-decoration: underline;
}
.map-button {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #d1d5db;
  background: #ffffff;
  color: #111827;
  font-size: 14px;
  cursor: pointer;
  text-align: center;
}

.map-button:hover {
  background: #f9fafb;
}

  
/* Mobile */
@media (max-width: 480px) {
  .wrapper {
    margin: 30px auto;
  }
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="card">
    <h1>Lambert 93 → WGS84</h1>

    <div class="field">
      <label for="x">X (Lambert 93)</label>
      <input id="x" type="number" inputmode="decimal">
    </div>

    <div class="field">
      <label for="y">Y (Lambert 93)</label>
      <input id="y" type="number" inputmode="decimal">
    </div>

    <button onclick="convert()">Convertir</button>

    <div id="result" class="result" style="display:none;"></div>
  </div>
</div>

<script>
proj4.defs("EPSG:2154",
"+proj=lcc +lat_1=49 +lat_2=44 +lat_0=46.5 +lon_0=3 +x_0=700000 +y_0=6600000 +ellps=GRS80 +units=m +no_defs"
);


function openMap(lat, lon) {
  const url = `https://www.google.com/maps?q=${lat},${lon}`;
  window.open(url, "_blank");
}
  
function convert() {
  const x = parseFloat(document.getElementById("x").value);
  const y = parseFloat(document.getElementById("y").value);

  if (isNaN(x) || isNaN(y)) {
    alert("Coordonnées invalides");
    return;
  }
  
  const result = proj4("EPSG:2154", "EPSG:4326", [x, y]);

  const lon = result[0];
  const lat = result[1];

  const link = `https://www.google.com/maps?q=${lat},${lon}`;
  
const output = `
  <div><strong>Latitude :</strong> ${lat.toFixed(6)}</div>
  <div><strong>Longitude :</strong> ${lon.toFixed(6)}</div>
  <button class="map-button" onclick="openMap('${lat}', '${lon}')">
    Ouvrir dans Google Maps
  </button>
`;
  
  const res = document.getElementById("result");
  res.style.display = "block";
  res.innerHTML = output;
}
</script>

</body>
</html>
