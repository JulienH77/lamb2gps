<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convertisseur Lambert 93 → GPS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  width: 90%;
  max-width: 400px;
}

h1 {
  font-size: 20px;
  margin-bottom: 20px;
  text-align: center;
}

input {
  width: 100%;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #4facfe;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #3a8dde;
}

.result {
  margin-top: 20px;
  padding: 15px;
  background: #f5f7fa;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.5;
}

a {
  color: #4facfe;
  text-decoration: none;
  font-weight: bold;
}

a:hover {
  text-decoration: underline;
}

/* Mobile spacing */
@media (max-height: 600px) {
  body {
    align-items: flex-start;
    padding-top: 20px;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>📍 Lambert 93 → GPS</h1>

  <input id="x" type="number" placeholder="Coordonnée X (Lambert 93)">
  <input id="y" type="number" placeholder="Coordonnée Y (Lambert 93)">

  <button onclick="convert()">Convertir</button>

  <div id="result" class="result" style="display:none;"></div>
</div>

<script>
proj4.defs("EPSG:2154",
"+proj=lcc +lat_1=49 +lat_2=44 +lat_0=46.5 +lon_0=3 +x_0=700000 +y_0=6600000 +ellps=GRS80 +units=m +no_defs"
);

function convert() {
  const x = parseFloat(document.getElementById("x").value);
  const y = parseFloat(document.getElementById("y").value);

  if (isNaN(x) || isNaN(y)) {
    alert("Entre des coordonnées valides !");
    return;
  }

  const result = proj4("EPSG:2154", "EPSG:4326", [x, y]);

  const lon = result[0];
  const lat = result[1];

  const googleLink = `https://www.google.com/maps?q=${lat},${lon}`;

  document.getElementById("result").style.display = "block";
  document.getElementById("result").innerHTML = `
    <strong>Latitude :</strong> ${lat.toFixed(6)}<br>
    <strong>Longitude :</strong> ${lon.toFixed(6)}<br><br>
    <a href="${googleLink}" target="_blank">📍 Ouvrir dans Google Maps</a>
  `;
}
</script>

</body>
</html>
